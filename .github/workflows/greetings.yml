name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue on Project Oracle Mk19! A maintainer
            will take a look soon. In the meantime, please make sure you've included
            enough detail (steps to reproduce, error output, environment) to help us
            diagnose the problem.
          pr-message: >
            Thanks for your first pull request to Project Oracle Mk19! A maintainer
            will review it soon. Please make sure all CI checks are passing and the PR
            description references the issue you're fixing (e.g. "Fixes #12").
